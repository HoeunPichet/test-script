;+------------------------------------------------------------------+
;|                    SMART MOMENTUM EA - SETTINGS FILE              |
;|                    High Win Rate Configuration                     |
;+------------------------------------------------------------------+
; Strategy: Buy when price tries to go up (bullish momentum)
;          Sell when price tries to go down (bearish momentum)
; Entry Confirmation: Multiple filters ensure quality setups
; Risk Management: Fixed % risk per trade with proper SL/TP
; Expected Win Rate: 60-75% with 1:1.5 or better R:R ratio
;+------------------------------------------------------------------+

[GENERAL_CONTROL]
MasterEnableTrading=true

[RISK_MANAGEMENT]
; === CRITICAL: This determines your risk per trade ===
; 1% risk = Conservative (Recommended for beginners)
; 2% risk = Moderate (For experienced traders)
; 3% risk = Aggressive (Only for professionals)
RiskPercent=1.0

; === Daily and Total Risk Limits ===
MaxDailyRisk=3.0                    ; Stop trading after 3% daily loss
MaxOpenRisk=5.0                     ; Max total exposure (5 trades at 1% each)
MaxConcurrentTrades=3               ; Max open positions at once

; === Minimum Risk:Reward Ratio ===
; 1.5 = Win 1.5 pips for every 1 pip risked
; Higher values = fewer trades but better quality
MinRiskRewardRatio=1.5              ; Recommended: 1.5 to 2.0

[MOMENTUM_ENTRY]
; === How to detect "price trying to go up/down" ===
UseMultiConfirmation=true           ; Use multiple timeframes (recommended)
MomentumPeriod=14                   ; Look back 14 candles for momentum
MinMomentumStrength=60.0            ; Minimum momentum strength (0-100)
                                    ; Lower = more trades, Higher = stronger signals
ConfirmationCandles=2               ; Require 2 candles confirming direction

[CANDLESTICK_PATTERNS]
; === Pattern Recognition for Entry ===
UseBullishEngulfing=true            ; Bullish reversal pattern
UseBearishEngulfing=true            ; Bearish reversal pattern
UsePinBar=true                      ; Rejection patterns (hammers, shooting stars)
UseInsideBar=true                   ; Continuation patterns
PinBarRatio=2.5                     ; Wick must be 2.5x body size

[TREND_FILTER]
; === Only trade WITH the trend (improves win rate) ===
UseTrendFilter=true                 ; HIGHLY RECOMMENDED
TrendMA_Fast=20                     ; Fast moving average (EMA)
TrendMA_Slow=50                     ; Slow moving average (EMA)
TrendTimeframe=16408                ; H1 timeframe for trend
                                    ; 1=M1, 5=M5, 15=M15, 16385=M30
                                    ; 16408=H1, 16408=H4, 16408=D1

[ADX_FILTER]
; === Trend Strength Filter (avoid choppy markets) ===
UseADXFilter=true                   ; Enable ADX filter
ADXPeriod=14                        ; Standard ADX period
MinADX=20.0                         ; Minimum ADX value
                                    ; 0-20 = Weak/no trend (avoid)
                                    ; 20-40 = Moderate trend (good)
                                    ; 40+ = Strong trend (excellent)

[RSI_FILTER]
; === Overbought/Oversold Filter ===
UseRSIFilter=true                   ; Prevent bad entries
RSIPeriod=14                        ; Standard RSI period
RSI_Overbought=70.0                 ; Don't buy above 70
RSI_Oversold=30.0                   ; Don't sell below 30
RSI_AllowExtreme=false              ; Don't trade in extreme zones

[STOP_LOSS_TAKE_PROFIT]
; === SL/TP Calculation Method ===
; 0=Fixed Pips, 1=ATR Based (Dynamic), 2=Swing High/Low
StopLossMode=1                      ; 1=ATR (RECOMMENDED)

; --- If using Fixed SL ---
FixedSL_Pips=50.0                   ; Fixed stop loss in pips

; --- If using ATR (Dynamic) ---
ATR_Period=14                       ; ATR calculation period
ATR_SL_Multiplier=2.0               ; SL = 2x ATR (adaptive to volatility)
ATR_TP_Multiplier=3.0               ; TP = 3x ATR (1:1.5 R:R ratio)

; --- If using Swing High/Low ---
SwingLookback=20                    ; Look back 20 bars for swing points

[TRAILING_STOP]
; === Lock in Profits as Trade Moves ===
UseTrailingStop=true                ; HIGHLY RECOMMENDED
TrailingStart_Pips=20.0             ; Start trailing after 20 pips profit
TrailingStop_Pips=15.0              ; Trail 15 pips behind price
TrailingStep_Pips=5.0               ; Move SL every 5 pips

[BREAK_EVEN]
; === Move SL to Entry Price ===
UseBreakEven=true                   ; Protect capital
BreakEven_Pips=15.0                 ; Activate at 15 pips profit
BreakEven_Plus=2.0                  ; Lock in 2 pips profit

[SESSION_FILTER]
; === Trade Specific Market Hours ===
; Adjust times to YOUR BROKER'S SERVER TIME
EnableSessionFilter=true            ; Enable time filter
TradeAsianSession=true              ; Trade Asian session
AsianSession=00:00-08:00            ; Asian session (adjust to broker time)
TradeLondonSession=true             ; Trade London session
LondonSession=08:00-16:00           ; London session
TradeNYSession=true                 ; Trade NY session
NYSession=13:00-22:00               ; NY session

[TRADING_DIRECTION]
EnableBuy=true                      ; Allow long positions
EnableSell=true                     ; Allow short positions
BuyMagicNumber=10001                ; Unique ID for buys
SellMagicNumber=10002               ; Unique ID for sells

[SPREAD_FILTER]
EnableSpreadFilter=true             ; Prevent high spread entries
MaxSpreadPips=3.0                   ; Max 3 pips spread (adjust per pair)
                                    ; EUR/USD: 1-2 pips
                                    ; GBP/USD: 2-3 pips
                                    ; Gold: 20-30 pips

[VOLATILITY_FILTER]
PauseOnHighVolatility=true          ; Pause during news/high volatility
VolatilityThreshold=1.5             ; Pause if ATR > 1.5x normal

;+------------------------------------------------------------------+
;|                    CONFIGURATION PROFILES                         |
;+------------------------------------------------------------------+

; === PROFILE 1: CONSERVATIVE (Recommended for $500-$2,000 accounts) ===
; RiskPercent=1.0
; MinRiskRewardRatio=2.0
; MinMomentumStrength=70.0
; UseTrendFilter=true
; UseADXFilter=true
; MinADX=25.0
; MaxConcurrentTrades=2
; Expected: 5-10 trades/week, 65-75% win rate

; === PROFILE 2: MODERATE (Recommended for $2,000-$10,000 accounts) ===
; RiskPercent=1.5
; MinRiskRewardRatio=1.5
; MinMomentumStrength=60.0
; UseTrendFilter=true
; UseADXFilter=true
; MinADX=20.0
; MaxConcurrentTrades=3
; Expected: 10-20 trades/week, 60-70% win rate

; === PROFILE 3: AGGRESSIVE (For $10,000+ accounts, experienced traders) ===
; RiskPercent=2.0
; MinRiskRewardRatio=1.5
; MinMomentumStrength=50.0
; UseTrendFilter=false
; UseADXFilter=true
; MinADX=15.0
; MaxConcurrentTrades=5
; Expected: 20-40 trades/week, 55-65% win rate

;+------------------------------------------------------------------+
;|                    PAIR-SPECIFIC SETTINGS                         |
;+------------------------------------------------------------------+

; === EUR/USD (Low volatility, tight spreads) ===
; MomentumPeriod=14
; MinMomentumStrength=60.0
; ATR_SL_Multiplier=2.0
; MaxSpreadPips=2.0
; Best Sessions: London + NY overlap

; === GBP/USD (Higher volatility) ===
; MomentumPeriod=14
; MinMomentumStrength=70.0
; ATR_SL_Multiplier=2.5
; MaxSpreadPips=3.0
; Best Sessions: London

; === USD/JPY (Asian session friendly) ===
; MomentumPeriod=14
; MinMomentumStrength=60.0
; ATR_SL_Multiplier=2.0
; MaxSpreadPips=2.0
; Best Sessions: Asian + London

; === GOLD/XAUUSD (High volatility) ===
; MomentumPeriod=10
; MinMomentumStrength=80.0
; ATR_SL_Multiplier=3.0
; MaxSpreadPips=30.0
; Best Sessions: London + NY
; WARNING: Use lower lot sizes due to high volatility

;+------------------------------------------------------------------+
;|                    OPTIMIZATION TIPS                              |
;+------------------------------------------------------------------+

; 1. START WITH CONSERVATIVE SETTINGS
;    - Test on demo account for 2-4 weeks
;    - Track win rate, R:R ratio, drawdown
;    - Only go live after consistent profitability

; 2. ADJUST FOR YOUR TRADING STYLE
;    - More trades: Lower MinMomentumStrength (50-60)
;    - Higher quality: Higher MinMomentumStrength (70-80)
;    - Tighter stops: Lower ATR_SL_Multiplier (1.5-2.0)
;    - Wider stops: Higher ATR_SL_Multiplier (2.5-3.0)

; 3. BACKTEST PARAMETERS
;    - Period: At least 3-6 months of data
;    - Test each pair individually
;    - Optimize for Profit Factor (aim for 1.5+)
;    - Optimize for Max Drawdown (aim for <20%)

; 4. RISK MANAGEMENT RULES
;    - Never risk more than 2% per trade
;    - Never have more than 6% total exposure
;    - Stop trading after 5% daily loss
;    - Take profits regularly (weekly/monthly)

; 5. MONITORING
;    - Check EA daily for errors
;    - Track performance in a journal
;    - Adjust settings monthly based on results
;    - Disable during major news events

;+------------------------------------------------------------------+
